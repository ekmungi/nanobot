<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>nanobot</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f17; --surface: #1a1a2e; --surface2: #252540;
    --text: #e0e0e0; --text-dim: #8888aa; --accent: #6c63ff;
    --accent-hover: #5a52d5; --user-bg: #2d2b55; --bot-bg: #1e1e36;
    --border: #333355; --radius: 12px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 800px; margin: 0 auto; }

  /* Header */
  #header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header h1 { font-size: 16px; font-weight: 600; }
  #header .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  #header .dot.connected { background: #4caf50; }
  #header button { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  #header button:hover { border-color: var(--accent); color: var(--text); }

  /* Messages */
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.5; font-size: 14px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: var(--text-dim); font-size: 12px; background: none; padding: 4px; }
  .msg.error { align-self: center; color: #ff6b6b; font-size: 12px; background: none; }

  /* Bot markdown styles */
  .msg.bot code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg.bot pre { background: var(--surface2); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .msg.bot pre code { background: none; padding: 0; display: block; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3 { margin: 12px 0 6px; }
  .msg.bot h1 { font-size: 1.3em; }
  .msg.bot h2 { font-size: 1.15em; }
  .msg.bot h3 { font-size: 1.05em; }
  .msg.bot ul, .msg.bot ol { padding-left: 20px; margin: 6px 0; }
  .msg.bot li { margin: 2px 0; }
  .msg.bot table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .msg.bot th, .msg.bot td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg.bot th { background: var(--surface2); }
  .msg.bot blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }
  .msg.bot a { color: var(--accent); text-decoration: none; }
  .msg.bot a:hover { text-decoration: underline; }
  .msg.bot hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .msg.bot p { margin: 4px 0; }

  .typing { align-self: flex-start; color: var(--text-dim); font-size: 13px; padding: 8px 14px; }
  .typing::after { content: '...'; animation: dots 1.5s steps(3, end) infinite; }
  @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }

  /* Input */
  #input-area { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 8px; background: var(--surface); }
  #input-area textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: var(--radius); font-size: 14px; font-family: inherit; resize: none; outline: none; min-height: 42px; max-height: 120px; line-height: 1.4; }
  #input-area textarea:focus { border-color: var(--accent); }
  #input-area textarea::placeholder { color: var(--text-dim); }
  #send-btn { background: var(--accent); border: none; color: #fff; padding: 0 18px; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  #send-btn:hover { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>nanobot</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="status"><div class="dot" id="status-dot"></div><span id="status-text">Connecting...</span></div>
      <button onclick="resetSession()">Reset</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1" autofocus></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let ws = null;
let chatId = null;
let reconnectDelay = 1000;

// --- Configure marked.js ---
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
});

// --- Token from URL or localStorage ---
function getToken() {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('token');
  if (t) { localStorage.setItem('nanobot_token', t); return t; }
  return localStorage.getItem('nanobot_token') || '';
}

// --- WebSocket connection ---
function connect() {
  const token = getToken();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?token=${encodeURIComponent(token)}`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    statusDot.classList.add('connected');
    statusText.textContent = 'Connected';
    reconnectDelay = 1000;
    sendBtn.disabled = false;
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      removeTyping();
      if (data.type === 'message') {
        addMessage(data.content, 'bot');
      } else if (data.type === 'system') {
        if (data.chatId) chatId = data.chatId;
        addMessage(data.content, 'system');
      } else if (data.type === 'error') {
        addMessage(data.content, 'error');
      }
    } catch (err) { console.error('Parse error:', err); }
  };

  ws.onclose = () => {
    statusDot.classList.remove('connected');
    statusText.textContent = 'Disconnected';
    sendBtn.disabled = true;
    removeTyping();
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
  };

  ws.onerror = () => { ws.close(); };
}

// --- Messages ---
function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'bot') {
    div.innerHTML = formatMarkdown(text);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  if (document.querySelector('.typing')) return;
  const div = document.createElement('div');
  div.className = 'typing';
  div.textContent = 'Thinking';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  document.querySelectorAll('.typing').forEach(el => el.remove());
}

// --- Markdown formatting (marked.js + DOMPurify) ---
function formatMarkdown(text) {
  const html = marked.parse(text);
  return DOMPurify.sanitize(html);
}

// --- Send ---
function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMessage(text, 'user');
  ws.send(JSON.stringify({ type: 'message', content: text }));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  showTyping();
}

function resetSession() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'reset' }));
    messagesEl.innerHTML = '';
  }
}

// --- Input handling ---
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// --- Start ---
connect();
</script>
</body>
</html>
