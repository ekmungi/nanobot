<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>nanobot</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0f0f13;
    --bg-secondary: #1a1a1f;
    --bg-tertiary: #25252d;
    --text-primary: #ececf1;
    --text-secondary: #8b8b9a;
    --text-tertiary: #565869;
    --accent: #d97706;
    --accent-hover: #f59e0b;
    --user-bg: #10a37f;
    --user-bg-hover: #1a9b6f;
    --bot-bg: #25252d;
    --border: #4a4a56;
    --radius: 8px;
  }

  html, body {
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  #app {
    display: flex;
    height: 100dvh;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #sidebar-header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  #new-chat-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
  }

  #new-chat-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--text-secondary);
  }

  #chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chat-item {
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-item:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  .chat-item.active {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-weight: 500;
  }

  #sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
    text-align: left;
  }

  .sidebar-btn:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-color: var(--text-primary);
  }

  /* Main content */
  #content {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
  }

  /* Header */
  #header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--bg-secondary);
  }

  #header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    transition: background 0.3s ease;
  }

  .status-dot.connected {
    background: #10b981;
  }

  .header-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
    border-radius: var(--radius);
  }

  .header-btn:hover {
    color: var(--text-primary);
    background: var(--bg-tertiary);
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .msg-group {
    display: flex;
    margin-bottom: 8px;
  }

  .msg-group.user {
    justify-content: flex-end;
  }

  .msg-group.bot {
    justify-content: flex-start;
  }

  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    word-wrap: break-word;
    word-break: break-word;
  }

  .msg-group.user .msg {
    background: var(--user-bg);
    color: white;
    border-radius: 18px;
  }

  .msg-group.bot .msg {
    background: var(--bot-bg);
    color: var(--text-primary);
    border-radius: 18px;
  }

  .msg.system {
    align-self: center;
    color: var(--text-secondary);
    font-size: 13px;
    background: none;
    padding: 8px;
    margin: 12px 0;
  }

  .msg.error {
    align-self: center;
    color: #ef4444;
    font-size: 13px;
    background: none;
    padding: 8px;
  }

  /* Bot markdown styles */
  .msg-group.bot .msg code {
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: #d97706;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
  }

  .msg-group.bot .msg pre {
    background: var(--bg-tertiary);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 10px 0;
    border: 1px solid var(--border);
  }

  .msg-group.bot .msg pre code {
    background: none;
    padding: 0;
    display: block;
    color: var(--text-primary);
  }

  .msg-group.bot .msg h1,
  .msg-group.bot .msg h2,
  .msg-group.bot .msg h3 {
    margin: 14px 0 8px;
    font-weight: 600;
  }

  .msg-group.bot .msg h1 { font-size: 1.4em; }
  .msg-group.bot .msg h2 { font-size: 1.2em; }
  .msg-group.bot .msg h3 { font-size: 1.1em; }

  .msg-group.bot .msg ul,
  .msg-group.bot .msg ol {
    padding-left: 24px;
    margin: 8px 0;
  }

  .msg-group.bot .msg li {
    margin: 4px 0;
  }

  .msg-group.bot .msg table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 14px;
  }

  .msg-group.bot .msg th,
  .msg-group.bot .msg td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }

  .msg-group.bot .msg th {
    background: var(--bg-tertiary);
    font-weight: 600;
  }

  .msg-group.bot .msg blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    color: var(--text-secondary);
    margin: 8px 0;
    font-style: italic;
  }

  .msg-group.bot .msg a {
    color: var(--accent);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .msg-group.bot .msg a:hover {
    color: var(--accent-hover);
  }

  .msg-group.bot .msg hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  .msg-group.bot .msg p {
    margin: 6px 0;
  }

  .typing {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 12px 16px;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-secondary);
    animation: pulse 1.4s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; }
    30% { opacity: 1; }
  }

  /* Input area */
  #input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    gap: 12px;
    background: var(--bg-primary);
  }

  #input-area-inner {
    flex: 1;
    display: flex;
    gap: 12px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 12px;
    transition: all 0.2s ease;
  }

  #input-area-inner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.1);
  }

  #input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
  }

  #input::placeholder {
    color: var(--text-tertiary);
  }

  #send-btn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0;
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  #send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  #send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar {
    width: 8px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--text-tertiary);
  }

  /* Responsive */
  @media (max-width: 768px) {
    #sidebar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    #sidebar.active {
      transform: translateX(0);
    }

    .msg {
      max-width: 85%;
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Chats</h1>
      <button id="new-chat-btn" onclick="newChat()">+</button>
    </div>
    <div id="chat-history"></div>
    <div id="sidebar-footer">
      <button class="sidebar-btn" onclick="resetSession()">🔄 Clear History</button>
      <button class="sidebar-btn" onclick="toggleSidebar()">✕ Close</button>
    </div>
  </div>

  <div id="content">
    <div id="header">
      <div id="header-title">nanobot</div>
      <div class="header-controls">
        <div class="status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Connecting...</span>
        </div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <div id="input-area-inner">
        <textarea id="input" placeholder="Message nanobot..." rows="1" autofocus></textarea>
        <button id="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const sidebarEl = document.getElementById('sidebar');
const chatHistoryEl = document.getElementById('chat-history');

let ws = null;
let chatId = null;
let reconnectDelay = 1000;
let chats = [];

// --- Configure marked.js ---
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
});

// --- Token from URL or localStorage ---
function getToken() {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('token');
  if (t) { localStorage.setItem('nanobot_token', t); return t; }
  return localStorage.getItem('nanobot_token') || '';
}

// --- Sidebar toggle ---
function toggleSidebar() {
  sidebarEl.classList.toggle('active');
}

// --- Chat history ---
function loadChats() {
  const saved = localStorage.getItem('nanobot_chats');
  chats = saved ? JSON.parse(saved) : [];
  renderChatHistory();
}

function renderChatHistory() {
  chatHistoryEl.innerHTML = '';
  chats.forEach((chat, idx) => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (chat.id === chatId ? ' active' : '');
    item.textContent = chat.title || `Chat ${idx + 1}`;
    item.onclick = () => switchChat(chat.id);
    chatHistoryEl.appendChild(item);
  });
}

function newChat() {
  const newId = 'chat_' + Date.now();
  chats.unshift({ id: newId, title: 'New chat', messages: [] });
  localStorage.setItem('nanobot_chats', JSON.stringify(chats));
  switchChat(newId);
}

function switchChat(id) {
  chatId = id;
  messagesEl.innerHTML = '';
  const chat = chats.find(c => c.id === id);
  if (chat && chat.messages) {
    chat.messages.forEach(msg => {
      addMessageToDOM(msg.content, msg.type, false);
    });
  }
  renderChatHistory();
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function saveCurrentChat() {
  const chat = chats.find(c => c.id === chatId);
  if (chat) {
    const messages = Array.from(messagesEl.querySelectorAll('.msg-group'));
    chat.messages = messages.map(m => ({
      type: m.classList.contains('user') ? 'user' : 'bot',
      content: m.querySelector('.msg').innerHTML
    }));
    localStorage.setItem('nanobot_chats', JSON.stringify(chats));
  }
}

// --- WebSocket connection ---
function connect() {
  const token = getToken();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?token=${encodeURIComponent(token)}`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    statusDot.classList.add('connected');
    statusText.textContent = 'Connected';
    reconnectDelay = 1000;
    sendBtn.disabled = false;
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      removeTyping();
      if (data.type === 'message') {
        addMessage(data.content, 'bot');
      } else if (data.type === 'system') {
        if (data.chatId) chatId = data.chatId;
        addMessage(data.content, 'system');
      } else if (data.type === 'error') {
        addMessage(data.content, 'error');
      }
    } catch (err) { console.error('Parse error:', err); }
  };

  ws.onclose = () => {
    statusDot.classList.remove('connected');
    statusText.textContent = 'Disconnected';
    sendBtn.disabled = true;
    removeTyping();
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
  };

  ws.onerror = () => { ws.close(); };
}

// --- Messages ---
function addMessageToDOM(text, type, shouldSave = true) {
  const group = document.createElement('div');
  group.className = `msg-group ${type}`;

  const msg = document.createElement('div');
  msg.className = `msg ${type}`;

  if (type === 'bot') {
    msg.innerHTML = formatMarkdown(text);
  } else {
    msg.textContent = text;
  }

  group.appendChild(msg);
  messagesEl.appendChild(group);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  if (shouldSave) {
    saveCurrentChat();
  }
}

function addMessage(text, type) {
  addMessageToDOM(text, type, true);
}

function showTyping() {
  if (document.querySelector('.typing')) return;
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div><span>Thinking</span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  document.querySelectorAll('.typing').forEach(el => el.remove());
}

// --- Markdown formatting (marked.js + DOMPurify) ---
function formatMarkdown(text) {
  const html = marked.parse(text);
  return DOMPurify.sanitize(html);
}

// --- Send ---
function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  if (!chatId) newChat();

  addMessage(text, 'user');
  ws.send(JSON.stringify({ type: 'message', content: text }));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  showTyping();
}

function resetSession() {
  if (confirm('Clear all chat history? This cannot be undone.')) {
    chats = [];
    localStorage.setItem('nanobot_chats', JSON.stringify(chats));
    messagesEl.innerHTML = '';
    chatId = null;
    renderChatHistory();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'reset' }));
    }
  }
}

// --- Input handling ---
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// --- Start ---
loadChats();
if (!chatId && chats.length > 0) {
  switchChat(chats[0].id);
}
connect();
</script>
</body>
</html>
